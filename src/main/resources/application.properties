spring.application.name=fixora-api

# Converts Render postgres:// or postgresql:// URLs into valid jdbc:postgresql://
spring.datasource.url=${SPRING_DATASOURCE_URL:#{environment.DATABASE_URL != null ? environment.DATABASE_URL.replace('postgres://', 'jdbc:postgresql://').replace('postgresql://', 'jdbc:postgresql://') : 'jdbc:postgresql://localhost:5432/fixora'}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

