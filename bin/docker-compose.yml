services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fixora
      MYSQL_USER: fixora
      MYSQL_PASSWORD: fixora
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

