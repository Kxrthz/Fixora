services:
  - type: web
    name: fixora-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_DATABASE
        value: fixora
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

